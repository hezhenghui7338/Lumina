[project]
name = "lumina-core"
version = "0.4.0"
description = "Lumina local AI reading engine sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "pypdf>=5.0.0",
    "ebooklib>=0.18",
    "feedparser>=6.0.0",
    "mobi>=0.3.3",
    "trafilatura>=2.0.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.9.0",
    "onnxruntime>=1.18.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.18.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.8.0",
]
release = [
    "pyinstaller>=6.11.0",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.18.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
lumina-core = "lumina_core.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumina_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: API end-to-end tests with Mock LLM",
    "live: tests requiring real Ollama (nightly)",
    "live_chunk: long-text chunking + summarize seg 0/1 with real Ollama",
    "release_live: release gate smoke with truncated fixtures + real Ollama",
    "perf: performance benchmarks",
]
filterwarnings = ["ignore::DeprecationWarning"]
