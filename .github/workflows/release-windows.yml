name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.7.0)"
        required: true
        default: "0.7.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build release (ZIP)
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $env:LUMINA_VERSION = "${{ github.event.inputs.version }}"
          } else {
            $env:LUMINA_VERSION = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          .\scripts\build-release-windows.ps1

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lumina-*-Windows-x64.zip
          fail_on_unmatched_files: true

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lumina-windows-${{ github.event.inputs.version }}
          path: dist/Lumina-*-Windows-x64.zip
